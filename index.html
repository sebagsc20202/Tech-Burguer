<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin · Tech Burgers</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* ... todo el CSS anterior ... (se mantiene igual) */
        /* Añadir este estilo para el botón PROMO */
        .btn-promo {
            background: #ffb703;
            color: #1a1a1a;
            border: none;
            padding: 4px 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            transition: background 0.2s;
            margin-left: 8px;
        }
        .btn-promo:hover {
            background: #e6a500;
        }
        /* ... resto del CSS ... */
    </style>
</head>
<body>
    <!-- ... todo el HTML anterior ... -->
    <div id="formProducto" class="form-producto">
        <h3 id="formProductoTitulo">✏️ Nuevo producto</h3>
        <!-- ... campos anteriores ... -->
        <div class="form-row">
            <div class="form-group" style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
                <label for="prodBadge" style="flex:1;">Badge</label>
                <input type="text" id="prodBadge" placeholder="Ej: NUEVO, BASE, PROMO" style="flex:2;" />
                <button type="button" class="btn-promo" onclick="document.getElementById('prodBadge').value='PROMO!!';">🎯 PROMO!!</button>
                <span class="hint-text" style="width:100%;">Etiqueta destacada</span>
            </div>
            <div class="form-group"><label for="prodId">ID <span class="required">*</span></label><input type="text" id="prodId" placeholder="Ej: doble-cheddar" readonly /><span class="hint-text">🔑 Único, sin espacios. <strong>No editable.</strong></span></div>
        </div>
        <!-- ... resto del formulario ... -->
    </div>
    <!-- ... resto del HTML y scripts ... -->
</body>
</html>
