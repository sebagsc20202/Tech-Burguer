<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin · Tech Burgers</title>

    <!-- Firebase SDKs (compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #1a2e1a;
            color: #e8f0e8;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 900px;
            width: 100%;
        }
        h1 {
            color: #ffb703;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2rem;
        }
        h2 {
            color: #ffb703;
            margin: 20px 0 10px;
            border-bottom: 1px solid #2f4a2f;
            padding-bottom: 6px;
        }

        /* ===== CARD ===== */
        .card {
            background: #1f331f;
            border: 2px solid #3a5a3a;
            border-radius: 16px;
            padding: 30px 24px;
            max-width: 400px;
            margin: 0 auto 30px;
        }
        .card h2 {
            border-bottom: none;
            text-align: center;
            margin-top: 0;
        }
        .card input {
            width: 100%;
            padding: 12px 16px;
            margin: 8px 0 12px;
            background: #1a2e1a;
            border: 1px solid #3a5a3a;
            border-radius: 40px;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }
        .card input:focus {
            border-color: #ffb703;
        }
        .card button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 40px;
            background: #ffb703;
            color: #1a1a1a;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .card button:hover {
            background: #e6a500;
        }
        .card .error {
            color: #ef9a9a;
            font-size: 0.9rem;
            margin-top: 8px;
            text-align: center;
        }
        .card .hint {
            color: #8aaa8a;
            font-size: 0.8rem;
            text-align: center;
            margin-top: 8px;
        }

        /* ===== PANEL ===== */
        #adminPanel {
            display: none;
        }
        #adminPanel.active {
            display: block;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }
        .panel-header .user-info {
            color: #b8d0b8;
        }
        .panel-header .user-info strong {
            color: #ffb703;
        }
        .btn-logout {
            background: #3a1a1a;
            color: #ef9a9a;
            border: 2px solid #f44336;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-logout:hover {
            background: #5a2a2a;
        }

        /* ===== LISTAS ===== */
        .product-item,
        .promo-item {
            background: #1f331f;
            border: 1px solid #3a5a3a;
            border-radius: 12px;
            padding: 12px 16px;
            margin: 10px 0;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
        }
        .product-item .name {
            flex: 2;
            font-weight: 600;
            min-width: 120px;
        }
        .product-item label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
        }
        .product-item input[type="number"] {
            width: 70px;
            padding: 6px 8px;
            border-radius: 30px;
            border: 1px solid #3a5a3a;
            background: #1a2e1a;
            color: #fff;
            font-weight: 600;
        }
        .product-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #ffb703;
            cursor: pointer;
        }
        .product-item button {
            background: #ffb703;
            border: none;
            padding: 6px 16px;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }
        .product-item button:hover {
            background: #e6a500;
        }

        .promo-item .info {
            flex: 1;
            min-width: 150px;
        }
        .promo-item .dates {
            font-size: 0.8rem;
            color: #b8d0b8;
        }
        .promo-item .status {
            font-weight: 600;
        }
        .promo-item .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn-danger {
            background: #f44336 !important;
            color: #fff !important;
        }
        .btn-danger:hover {
            background: #d32f2f !important;
        }
        .btn-edit {
            background: #2196F3 !important;
            color: #fff !important;
        }
        .btn-edit:hover {
            background: #1976D2 !important;
        }
        .btn-add {
            background: #4caf50;
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            margin: 10px 0;
        }
        .btn-add:hover {
            background: #388e3c;
        }

        /* ===== FORMULARIO PROMO ===== */
        .form-promo {
            background: #1f331f;
            border: 2px solid #3a5a3a;
            border-radius: 12px;
            padding: 20px;
            margin: 15px 0;
            display: none;
        }
        .form-promo.active {
            display: block;
        }
        .form-promo input {
            width: 100%;
            padding: 10px 14px;
            margin: 6px 0;
            border-radius: 40px;
            border: 1px solid #3a5a3a;
            background: #1a2e1a;
            color: #fff;
        }
        .form-promo input[type="checkbox"] {
            width: auto;
            margin-right: 8px;
        }
        .form-promo .row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .form-promo .row input {
            flex: 1;
            min-width: 150px;
        }
        .form-promo .actions {
            display: flex;
            gap: 12px;
            margin-top: 12px;
        }
        .form-promo .actions button {
            padding: 10px 24px;
            border: none;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-save {
            background: #ffb703;
            color: #1a1a1a;
        }
        .btn-save:hover {
            background: #e6a500;
        }
        .btn-cancel {
            background: #555;
            color: #fff;
        }
        .btn-cancel:hover {
            background: #444;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 600px) {
            .product-item,
            .promo-item {
                flex-direction: column;
                align-items: stretch;
            }
            .product-item label {
                justify-content: space-between;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍔 Admin Tech Burgers</h1>

        <!-- ===== LOGIN ===== -->
        <div id="authSection" class="card">
            <h2>🔐 Iniciar sesión</h2>
            <input type="email" id="emailInput" placeholder="Correo electrónico" value="admin@techburgers.com" />
            <input type="password" id="passInput" placeholder="Contraseña" />
            <div id="authError" class="error"></div>
            <button id="authButton">Ingresar</button>
            <div class="hint">Usá el correo y contraseña configurado en Firebase.</div>
        </div>

        <!-- ===== PANEL DE ADMIN ===== -->
        <div id="adminPanel">
            <div class="panel-header">
                <span class="user-info">👤 <strong id="userEmail">admin@techburgers.com</strong></span>
                <button class="btn-logout" id="logoutBtn">🚪 Cerrar sesión</button>
            </div>

            <!-- Productos -->
            <h2>📋 Productos</h2>
            <div id="productList"></div>

            <hr style="border-color:#2f4a2f; margin:20px 0;">

            <!-- Promociones -->
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
                <h2>🎯 Promociones</h2>
                <button class="btn-add" id="addPromoBtn">➕ Agregar promoción</button>
            </div>
            <div id="promoList"></div>

            <!-- Formulario de promoción -->
            <div id="formPromo" class="form-promo">
                <h3>✏️ Nueva promoción</h3>
                <input type="text" id="promoTitulo" placeholder="Título (ej: 2x1)">
                <input type="text" id="promoDesc" placeholder="Descripción (ej: Llevá dos burgers)">
                <input type="text" id="promoImagen" placeholder="URL imagen (ej: images/promo1.jpg)">
                <div class="row">
                    <input type="date" id="promoInicio">
                    <input type="date" id="promoFin">
                </div>
                <div style="margin: 10px 0;">
                    <label style="display:flex; align-items:center; gap:8px;">
                        <input type="checkbox" id="promoActiva" checked> Activa
                    </label>
                </div>
                <div class="actions">
                    <button class="btn-save" id="savePromoBtn">💾 Guardar</button>
                    <button class="btn-cancel" id="cancelPromoBtn">Cancelar</button>
                </div>
            </div>

            <hr style="border-color:#2f4a2f; margin:20px 0;">
            <div style="font-size:0.8rem; color:#6a8a6a;">
                Los cambios se guardan automáticamente en Firebase.
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        //  CONFIGURACIÓN DE FIREBASE (TUS DATOS)
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyCbS9zdQcpj0HThGqQVKcfsNjMFQ9gjf9U",
            authDomain: "tech-burgers.firebaseapp.com",
            databaseURL: "https://tech-burgers-default-rtdb.firebaseio.com",
            projectId: "tech-burgers",
            storageBucket: "tech-burgers.firebasestorage.app",
            messagingSenderId: "795678558305",
            appId: "1:795678558305:web:5929a7d3789a939d6f4220"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        // ============================================================
        //  REFERENCIAS DOM
        // ============================================================
        const authSection = document.getElementById('authSection');
        const adminPanel = document.getElementById('adminPanel');
        const authButton = document.getElementById('authButton');
        const authError = document.getElementById('authError');
        const emailInput = document.getElementById('emailInput');
        const passInput = document.getElementById('passInput');
        const userEmail = document.getElementById('userEmail');
        const logoutBtn = document.getElementById('logoutBtn');

        // ============================================================
        //  AUTENTICACIÓN
        // ============================================================
        authButton.addEventListener('click', () => {
            const email = emailInput.value.trim();
            const pass = passInput.value.trim();
            if (!email || !pass) {
                authError.textContent = 'Completá ambos campos.';
                return;
            }
            if (pass.length < 6) {
                authError.textContent = 'La contraseña debe tener al menos 6 caracteres.';
                return;
            }

            authError.textContent = '';

            // Login
            auth.signInWithEmailAndPassword(email, pass)
                .then(userCredential => {
                    // Éxito
                })
                .catch(error => {
                    authError.textContent = error.message;
                });
        });

        // Enter para enviar
        passInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') authButton.click();
        });
        emailInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') authButton.click();
        });

        // ============================================================
        //  ESTADO DE AUTENTICACIÓN
        // ============================================================
        auth.onAuthStateChanged(user => {
            if (user) {
                // Usuario autenticado
                authSection.style.display = 'none';
                adminPanel.classList.add('active');
                userEmail.textContent = user.email;
                cargarDatos();
                // Resetear formulario de promoción
                ocultarFormPromo();
            } else {
                // No autenticado
                authSection.style.display = 'block';
                adminPanel.classList.remove('active');
                authError.textContent = '';
                // Limpiar campos (pero mantener el email prellenado)
                passInput.value = '';
                // Desconectar listeners de Firebase
                db.ref('products').off();
                db.ref('promotions').off();
            }
        });

        logoutBtn.addEventListener('click', () => {
            auth.signOut();
        });

        // ============================================================
        //  CARGA DE DATOS
        // ============================================================
        function cargarDatos() {
            cargarProductos();
            cargarPromociones();
        }

        // ---- PRODUCTOS ----
        function cargarProductos() {
            db.ref('products').on('value', (snapshot) => {
                const data = snapshot.val();
                if (!data) {
                    // Si no hay productos, crear por defecto
                    crearProductosDefault();
                    return;
                }
                const productos = Object.keys(data).map(key => ({ id: key, ...data[key] }));
                renderProductos(productos);
            });
        }

        function renderProductos(productos) {
            const list = document.getElementById('productList');
            list.innerHTML = '';
            if (productos.length === 0) {
                list.innerHTML = '<p style="color:#b8d0b8;">No hay productos cargados.</p>';
                return;
            }
            productos.forEach(p => {
                const div = document.createElement('div');
                div.className = 'product-item';
                div.innerHTML = `
                    <span class="name">${p.name} ${p.badge ? '<span style="background:#e63946;padding:2px 8px;border-radius:20px;font-size:0.7rem;color:#fff;">'+p.badge+'</span>' : ''}</span>
                    <label>💰 Precio: <input type="number" value="${p.price}" data-id="${p.id}" class="price-input"></label>
                    <label>📦 Disponible: <input type="checkbox" ${p.available !== false ? 'checked' : ''} data-id="${p.id}" class="avail-input"></label>
                    <button onclick="actualizarProducto('${p.id}')">Guardar</button>
                `;
                list.appendChild(div);
            });
        }

        window.actualizarProducto = async function(id) {
            const priceInput = document.querySelector(`.price-input[data-id="${id}"]`);
            const availInput = document.querySelector(`.avail-input[data-id="${id}"]`);
            if (!priceInput || !availInput) return;
            const price = parseInt(priceInput.value);
            const available = availInput.checked;
            try {
                await db.ref('products/' + id).update({ price, available });
                alert('✅ Producto actualizado correctamente');
            } catch (error) {
                alert('❌ Error al actualizar: ' + error.message);
            }
        };

        function crearProductosDefault() {
            const defaultProducts = [
                { id: 'armatuburger', name: 'Armá tu Burger', price: 12000, desc: '1 medallón 120gr · doble cheddar · salsa Tech.', hasExtras: true, badge: 'BASE', imagen: 'images/arm.jpg', popupImg: 'images/bn1.webp', available: true },
                { id: 'doblep', name: 'Doble Provoleta', price: 18000, desc: 'Doble medallón 120gr · provoleta · morrones asados · mayo de chimi · pan brioche.', hasExtras: false, badge: null, imagen: 'images/pro.jpg', popupImg: 'images/bn2.webp', available: true },
                { id: 'intense', name: 'Intense', price: 18000, desc: 'Doble medallón 120gr · roquefort fundido · champis asados · crema de cebollín · pan de papa.', hasExtras: false, badge: null, imagen: 'images/int.jpg', popupImg: 'images/bn3.webp', available: true },
                { id: 'techmex', name: 'Tech Mex', price: 18000, desc: 'Doble medallón 120gr · doble queso dambo · guacamole · crema de cebollín · pan de papa.', hasExtras: false, badge: null, imagen: 'images/mex.jpg', popupImg: 'images/bn4.webp', available: true },
                { id: 'yankee', name: 'Yankee', price: 16000, desc: 'Doble medallón 120gr · doble cheddar · panceta ahumada crocante · barbacoa · pan brioche.', hasExtras: false, badge: null, imagen: 'images/yan.jpg', popupImg: 'images/bn5.webp', available: true },
                { id: 'clasica', name: 'Clásica', price: 16000, desc: 'Medallón 120gr · doble queso dambo · jamón cocido · huevo · lechuga · tomate · mayonesa · pan de papa.', hasExtras: false, badge: null, imagen: 'images/cla.jpg', popupImg: 'images/bn6.webp', available: true }
            ];
            defaultProducts.forEach(p => {
                db.ref('products/' + p.id).set(p);
            });
            // Crear una promoción de ejemplo
            db.ref('promotions').push({
                title: 'Promo 2x1',
                description: 'Llevá dos burgers por el precio de una',
                image: 'images/promo1.jpg',
                startDate: '2026-08-18',
                endDate: '2026-08-31',
                active: true
            });
        }

        // ---- PROMOCIONES ----
        function cargarPromociones() {
            db.ref('promotions').on('value', (snapshot) => {
                const data = snapshot.val();
                if (!data) {
                    document.getElementById('promoList').innerHTML = '<p style="color:#b8d0b8;">No hay promociones aún.</p>';
                    return;
                }
                const promos = Object.keys(data).map(key => ({ id: key, ...data[key] }));
                renderPromociones(promos);
            });
        }

        function renderPromociones(promos) {
            const list = document.getElementById('promoList');
            list.innerHTML = '';
            promos.forEach(p => {
                const div = document.createElement('div');
                div.className = 'promo-item';
                div.innerHTML = `
                    <div class="info">
                        <strong>${p.title}</strong> — ${p.description}
                    </div>
                    <div class="dates">${p.startDate || ''} → ${p.endDate || ''}</div>
                    <div class="status">${p.active ? '✅ Activa' : '❌ Inactiva'}</div>
                    <div class="actions">
                        <button class="btn-edit" onclick="editarPromocion('${p.id}')">✏️ Editar</button>
                        <button class="btn-danger" onclick="eliminarPromocion('${p.id}')">🗑️ Eliminar</button>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        // ---- CRUD Promociones ----
        function mostrarFormPromo() {
            document.getElementById('formPromo').classList.add('active');
            document.getElementById('promoTitulo').value = '';
            document.getElementById('promoDesc').value = '';
            document.getElementById('promoImagen').value = '';
            document.getElementById('promoInicio').value = '';
            document.getElementById('promoFin').value = '';
            document.getElementById('promoActiva').checked = true;
        }

        function ocultarFormPromo() {
            document.getElementById('formPromo').classList.remove('active');
        }

        document.getElementById('addPromoBtn').addEventListener('click', mostrarFormPromo);
        document.getElementById('cancelPromoBtn').addEventListener('click', ocultarFormPromo);

        document.getElementById('savePromoBtn').addEventListener('click', async function() {
            const titulo = document.getElementById('promoTitulo').value.trim();
            const desc = document.getElementById('promoDesc').value.trim();
            if (!titulo || !desc) {
                alert('❌ Título y descripción son obligatorios');
                return;
            }
            const data = {
                title: titulo,
                description: desc,
                image: document.getElementById('promoImagen').value.trim() || '',
                startDate: document.getElementById('promoInicio').value || '',
                endDate: document.getElementById('promoFin').value || '',
                active: document.getElementById('promoActiva').checked
            };
            try {
                await db.ref('promotions').push(data);
                alert('✅ Promoción creada');
                ocultarFormPromo();
            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        });

        window.eliminarPromocion = async function(id) {
            if (!confirm('¿Eliminar esta promoción?')) return;
            try {
                await db.ref('promotions/' + id).remove();
                alert('✅ Eliminada');
            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        };

        window.editarPromocion = async function(id) {
            const nuevoTitulo = prompt('Nuevo título:');
            if (nuevoTitulo === null) return;
            if (nuevoTitulo.trim() === '') {
                alert('El título no puede estar vacío');
                return;
            }
            try {
                await db.ref('promotions/' + id).update({ title: nuevoTitulo.trim() });
                alert('✅ Título actualizado');
            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        };
    </script>
</body>
</html>
